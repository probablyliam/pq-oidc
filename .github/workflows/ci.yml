name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build the Token Lab
        run: npm run lab:build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  kubernetes:
    name: Deploy to kind and sign in
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t pq-oidc:ci .
      - name: Create a kind cluster
        uses: helm/kind-action@v1
      - name: Load the image into kind
        run: kind load docker-image pq-oidc:ci --name chart-testing
      - uses: azure/setup-helm@v5
      - name: Lint the chart
        run: helm lint deploy/helm/pq-oidc
      - name: Install the chart
        run: |
          helm install pq-oidc deploy/helm/pq-oidc \
            --set image.repository=pq-oidc --set image.tag=ci \
            --wait --timeout 3m
          kubectl get pods -o wide
      - name: Port-forward the services
        run: |
          kubectl port-forward svc/pq-oidc-provider 3000:3000 >/tmp/pf-provider.log 2>&1 &
          kubectl port-forward svc/pq-oidc-legacy-app 3001:3001 >/tmp/pf-legacy.log 2>&1 &
          kubectl port-forward svc/pq-oidc-pq-app 3002:3002 >/tmp/pf-pq.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/healthz && break; sleep 1; done
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sign in to both apps through the cluster
        run: npm run smoke
      - name: Migrate Legacy App too early and expect it to refuse the token
        run: |
          helm upgrade pq-oidc deploy/helm/pq-oidc --reuse-values --set apps.legacy.idTokenAlg=ML-DSA-65 --wait --timeout 3m
          kubectl rollout status deploy/pq-oidc-provider
          pkill -f "port-forward svc/pq-oidc-provider" || true
          kubectl port-forward svc/pq-oidc-provider 3000:3000 >/tmp/pf-provider.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/healthz && break; sleep 1; done
          if npm run smoke; then echo "Legacy App should have rejected ML-DSA-65" && exit 1; fi
          echo "Legacy App rejected the ML-DSA-65 token, as expected."
      - name: Show logs on failure
        if: failure()
        run: |
          kubectl get all
          kubectl logs deploy/pq-oidc-provider --tail=100 || true
          kubectl logs deploy/pq-oidc-legacy-app --tail=100 || true
          kubectl logs deploy/pq-oidc-pq-app --tail=100 || true

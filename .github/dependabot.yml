version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # react and react-dom must always move together.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      dev-dependencies:
        dependency-type: development
    ignore:
      # Internal workspace packages live in this repo, not on the npm registry.
      - dependency-name: '@pq-oidc/*'
      # Types track the Node.js line we run on (24 LTS); bump them with the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Compiler majors need the linter and build tools to catch up; upgrade by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: pip
    directory: /interop/python
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node.js LTS line; move majors deliberately, together with CI and engines.
      - dependency-name: node
        update-types: ['version-update:semver-major']

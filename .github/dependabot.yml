version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # react and react-dom must always move together.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      dev-dependencies:
        dependency-type: development
    ignore:
      # Types track the Node.js line we run on (24 LTS); bump them with the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node.js LTS line; move majors deliberately, together with CI and engines.
      - dependency-name: node
        update-types: ['version-update:semver-major']

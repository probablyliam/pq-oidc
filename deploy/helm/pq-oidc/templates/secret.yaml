{{- /*
Secrets generated once and kept across upgrades by looking up the existing Secret:
the worker's token, the provider's cookie keys and the demo apps' client secrets.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "pq-oidc.secretName" .) -}}
{{- $data := dict -}}
{{- if $existing }}{{- $data = $existing.data -}}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pq-oidc.secretName" . }}
  labels:
    {{- include "pq-oidc.labels" . | nindent 4 }}
type: Opaque
data:
  worker-token: {{ get $data "worker-token" | default (randAlphaNum 48 | b64enc) }}
  cookie-keys: {{ get $data "cookie-keys" | default (randAlphaNum 43 | b64enc) }}
  {{- range $name, $app := .Values.apps }}
  {{- $key := printf "%s-client-secret" $name }}
  {{ $key }}: {{ get $data $key | default (randAlphaNum 43 | b64enc) }}
  {{- end }}

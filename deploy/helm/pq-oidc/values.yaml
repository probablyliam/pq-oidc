# Build locally with `docker build -t pq-oidc:local .` (and `kind load docker-image pq-oidc:local` for kind).
image:
  repository: pq-oidc
  tag: local
  pullPolicy: IfNotPresent

# ---- The scanner: the web app and API, and the worker that connects to scan targets.
scanner:
  enabled: true
  # The URL visitors use. Cross-site requests are refused by comparing against it.
  # The default suits `kubectl port-forward`; set it to your ingress URL otherwise.
  publicUrl: http://localhost:8080
  # Ports a scan may connect to; also the only ports the worker's NetworkPolicy lets it reach.
  allowedPorts: [443, 8443]
  retentionHours: 1
  api:
    # Set to true behind an ingress, so the client address comes from X-Forwarded-For.
    trustProxy: false
    storage: 1Gi
    storageClassName: ""
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }
  worker:
    replicas: 1
    concurrency: 2
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 384Mi }
  networkPolicy:
    # The worker may reach the internet on allowedPorts (plus 80 for the plain-HTTP check), DNS, and the
    # API's internal port; not private ranges or other pods. The API opens no connections at all.
    # Needs a CNI that enforces NetworkPolicy (Calico, Cilium, ...); kind's default one does not.
    enabled: true

# ---- The ML-DSA identity provider and its two demo apps (the migration demonstration).
oidc:
  enabled: false

# The URL browsers use to reach the provider. It becomes the "iss" claim in every token.
# The default suits `kubectl port-forward`; set it to your ingress URL otherwise.
issuer: http://localhost:3000

provider:
  port: 3000
  # Keep at 1 unless you add a shared storage adapter: sessions and codes live in memory.
  replicas: 1
  trustProxy: false
  # Name of a Secret holding a private JWKS under the key "signing-keys.json"
  # (one ES256 and one ML-DSA-65 key). If empty, keys are generated at startup.
  signingKeysSecret: ""
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }

apps:
  legacy:
    enabled: true
    clientId: legacy-app
    preset: legacy
    port: 3001
    baseUrl: http://localhost:3001
    # The migration switch: which algorithm the provider signs this app's ID tokens with.
    idTokenAlg: ES256
  pq:
    enabled: true
    clientId: pq-app
    preset: pq
    port: 3002
    baseUrl: http://localhost:3002
    idTokenAlg: ML-DSA-65

appResources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { memory: 192Mi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
